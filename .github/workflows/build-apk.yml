name: Build IslamicHub APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: gradle-

      - name: Grant execute permission
        run: chmod +x ./gradlew || true

      - name: Build debug APK
        run: |
          # Generate gradlew if not present
          if [ ! -f gradlew ]; then
            curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.5/bin/gradle wrapper --gradle-version 8.5
          fi
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
        env:
          JAVA_TOOL_OPTIONS: "-Xmx4g"

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        env:
          JAVA_TOOL_OPTIONS: "-Xmx4g"
        continue-on-error: true

      - name: Copy APKs
        run: |
          find app/build/outputs/apk -name "*.apk" -exec ls -la {} \;
          DEBUG_APK=$(find app/build/outputs/apk -name "*debug*.apk" | head -1)
          if [ -n "$DEBUG_APK" ]; then cp "$DEBUG_APK" IslamicHub-debug.apk; fi
          RELEASE_APK=$(find app/build/outputs/apk -name "*release*.apk" | head -1)
          if [ -n "$RELEASE_APK" ]; then cp "$RELEASE_APK" IslamicHub-release.apk; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IslamicHub-debug-apk
          path: IslamicHub-debug.apk
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IslamicHub-release-apk
          path: IslamicHub-release.apk
          if-no-files-found: ignore
